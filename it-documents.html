<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d39"><title>Documentation register | AMFCC</title><link rel="stylesheet" href="shared_ui.css"><link rel="stylesheet" href="operations.css?v=12"><link rel="stylesheet" href="it-register.css?v=1"></head>
<body data-it-register="documents"><main class="register-shell">
 <header class="register-header"><div><p class="eyebrow">AMFCC IT Department</p><h1>Documentation register</h1><p id="register-state" class="register-state" role="status">Checking workspace access…</p></div><button id="register-signout" class="button secondary" type="button">Sign out</button></header>
 <nav class="register-nav" aria-label="IT registers"><a class="button secondary" href="index.html">Department Operations</a><a class="button secondary" href="it-assets.html">Asset register</a><a class="button current" href="it-documents.html" aria-current="page">Documentation</a></nav>
 <section id="register-access-error" class="panel register-access-error" hidden><h2>Register access</h2><p></p><a class="button primary" href="index.html?returnTo=it-documents.html">Open workspace login</a></section>
 <section id="register-content" hidden>
  <div class="view-heading"><p class="muted">Import PDF and Word documents. New versions automatically archive the previous file.</p><div class="header-actions"><button id="docs-refresh" type="button" class="button secondary">Refresh documents</button><button id="docs-import" type="button" class="button primary" hidden>Import document</button></div></div>
  <p id="docs-message" class="asset-message" role="status" aria-live="polite" hidden></p>
  <div class="docs-section-tabs" role="group" aria-label="Document sections"><button type="button" data-section="how_to" aria-pressed="true"><strong>Technical How-Tos</strong><span id="docs-how-count">SOPs and troubleshooting guides</span></button><button type="button" data-section="specification" aria-pressed="false"><strong>Technical Specifications</strong><span id="docs-spec-count">System specifications and references</span></button></div>
  <article class="panel"><div class="docs-search-row"><label>Search documents<input id="docs-search" type="search" placeholder="Title, category, file name or version notes" autocomplete="off"></label><label>Category<select id="docs-category"><option value="">All categories</option></select></label><label>Document type<select id="docs-type"><option value="">All types</option><option>SOP</option><option>Troubleshooting guide</option><option>Reference</option><option>Technical specification</option></select></label></div><div class="docs-result-bar"><p id="docs-results-count" role="status" aria-live="polite"></p><div class="docs-actions"><button id="docs-current" type="button" class="button primary" aria-pressed="true">Current documents</button><button id="docs-archive" type="button" class="button secondary" aria-pressed="false">Archive</button><button id="docs-clear" type="button" class="button quiet">Clear filters</button></div></div><div id="docs-list" class="docs-list" aria-busy="false"></div></article>
  <p id="docs-last-refresh" class="muted"></p>
 </section>
 <dialog id="docs-upload-dialog" class="docs-dialog" aria-labelledby="docs-upload-title"><form id="docs-upload-form"><div class="docs-dialog-heading"><h2 id="docs-upload-title">Import document</h2><button id="docs-upload-close" class="button quiet" type="button">Close</button></div><p id="docs-form-error" class="asset-message error" role="alert" hidden></p><div class="docs-form-fields"><label class="wide">Document title<input id="docs-title" maxlength="300" required></label><label>Section<select id="docs-section"><option value="how_to">Technical How-Tos</option><option value="specification">Technical Specifications</option></select></label><label>Category<input id="docs-form-category" list="docs-category-options" maxlength="100" required placeholder="Choose or enter a category"></label><label class="wide">Document type<select id="docs-form-type"><option>SOP</option><option>Troubleshooting guide</option><option>Reference</option><option>Technical specification</option></select></label><label class="wide">PDF or Word document<input id="docs-file" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required><span class="docs-file-help">PDF, DOC or DOCX. Maximum file size: 20 MB.</span></label><label class="wide">What changed?<textarea id="docs-change-note" maxlength="2000" placeholder="Describe the changes for the version history"></textarea></label></div><p id="docs-version-help" class="muted"></p><div class="docs-dialog-actions"><button id="docs-upload-cancel" type="button" class="button secondary">Cancel</button><button id="docs-upload-submit" type="submit" class="button primary">Import document</button></div></form></dialog>
 <dialog id="docs-history-dialog" class="docs-dialog" aria-labelledby="docs-history-title"><div class="docs-dialog-heading"><h2 id="docs-history-title">Version history</h2><button id="docs-history-close" class="button quiet" type="button">Close</button></div><div id="docs-history-list" class="docs-history-list"></div></dialog>
 <datalist id="docs-category-options"></datalist>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="shared_config.js?v=2"></script><script src="it-register-session.js?v=1"></script><script src="it-documents.js?v=1"></script></body></html>
