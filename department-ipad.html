<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123d2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AMFCC Department iPad</title>
  <link rel="icon" href="assets_icon.svg" type="image/svg+xml">
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173c2b;background:#eff5ef}
    *{box-sizing:border-box}body{margin:0}
    main{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
    section{width:min(460px,100%);background:#fff;border-radius:18px;padding:27px;box-shadow:0 8px 35px #173c2b1a}
    h1{font-size:25px;margin:0 0 10px}p{line-height:1.5;margin:8px 0 16px}
    label{display:block;margin:14px 0 6px;font-weight:600}
    input{font-size:16px;width:100%;padding:12px;border:1px solid #9aafa1;border-radius:8px}
    button{border:0;border-radius:10px;background:#123d2b;color:white;padding:13px 16px;font-size:16px;width:100%;font-weight:600}
    button:disabled{opacity:.55}.muted{color:#53645a}.error{color:#a22d2d}
    [hidden]{display:none !important}
    #workspace{border:0;display:block;width:100%;height:100vh;height:100dvh;background:#fff}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared_config.js?v=7-registration-exemptions"></script>
</head>
<body>
  <main id="status-view">
    <section>
      <h1 id="title">AMFCC Department iPad</h1>
      <p class="muted" id="message" role="status">Checking this iPad…</p>
      <form id="activate-form" hidden>
        <label for="setup-key">Private IT setup key</label>
        <input id="setup-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <label for="activation-pin">Activation PIN</label>
        <input id="activation-pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="off" required>
        <label for="device-name">Device name (optional)</label>
        <input id="device-name" type="text" maxlength="80" autocomplete="off" placeholder="AMFCC Bakery 01">
        <p class="muted">IT enters the setup key and PIN once per iPad. Future visits open this department without its shared PIN.</p>
        <button id="activate-button" type="submit">Activate this iPad</button>
      </form>
      <button id="retry-button" type="button" hidden>Retry connection</button>
    </section>
  </main>
  <iframe id="workspace" title="AMFCC Department Operations" src="about:blank" hidden></iframe>
  <script>
  (function () {
    'use strict';
    var params = new URLSearchParams(window.location.search || '');
    var department = String(params.get('department') || '').trim().toLowerCase();
    var STORAGE_KEY = 'amfcc_department_kiosk_v1_' + department;
    var SESSION_KEY = 'amfcc_ops_session';
    var iframe = document.getElementById('workspace');
    var view = document.getElementById('status-view');
    var status = document.getElementById('message');
    var form = document.getElementById('activate-form');
    var retry = document.getElementById('retry-button');
    var setupInput = document.getElementById('setup-key');
    var pinInput = document.getElementById('activation-pin');
    var client = null, sessionExpiry = 0, refreshing = false, lastActivity = Date.now();
    var preloadSetup = String(params.get('setup') || '');

    function label() {
      return department.split('-').map(function (part) { return part.slice(0,1).toUpperCase()+part.slice(1); }).join(' ');
    }
    function show(message,error) {
      status.textContent=message;
      status.className=error?'error':'muted';
      view.hidden=false;
      iframe.hidden=true;
    }
    function randomKey() {
      if (!window.crypto || !window.crypto.getRandomValues) throw new Error('This browser does not support secure device activation.');
      var bytes=new Uint8Array(32);
      window.crypto.getRandomValues(bytes);
      return Array.prototype.map.call(bytes,function (n) { return n.toString(16).padStart(2,'0'); }).join('');
    }
    function timeout(promise) {
      return Promise.race([promise,new Promise(function (_,reject) { setTimeout(function () { reject(new Error('The server did not respond. Check Wi-Fi and retry.')); },20000); })]);
    }
    async function rpc(name,args) {
      var response=await timeout(client.rpc(name,args));
      if (response.error) throw new Error(response.error.message || 'Service unavailable.');
      return response.data || {};
    }
    function recordActivity() {lastActivity=Date.now();}
    function bindFrameActivity() {
      try {
        var w=iframe.contentWindow;
        if (w && w.document) ['touchstart','pointerdown','keydown','input'].forEach(function (eventName) {
          w.document.addEventListener(eventName,recordActivity,{passive:true});
        });
      } catch(e) { /* Cross-origin pages are intentionally unsupported. */ }
    }
    function openWorkspace(session, forceReload) {
      if (!session || session.role !== 'department' || !session.department || session.department.slug !== department)
        throw new Error('The server did not authorise this department.');
      sessionStorage.setItem(SESSION_KEY,JSON.stringify(session));
      sessionExpiry=new Date(session.expires_at).getTime();
      view.hidden=true;
      iframe.hidden=false;
      if (forceReload || iframe.getAttribute('src')==='about:blank') iframe.src='index.html';
    }
    async function signIn(forceReload) {
      var key=localStorage.getItem(STORAGE_KEY);
      if (!key) throw new Error('This iPad has not yet been activated.');
      var session=await rpc('ops_kiosk_login',{p_department_slug:department,p_device_key:key});
      if(session.status!=='success') throw new Error(session.message || 'Device access was denied.');
      openWorkspace(session,forceReload);
    }
    function cleanUrl() { history.replaceState({},document.title,location.pathname+'?department='+encodeURIComponent(department)); }
    async function start() {
      try {
        if(!/^[a-z0-9][a-z0-9-]{1,79}$/.test(department)) throw new Error('The department URL is invalid. Contact AMFCC IT.');
        document.title='AMFCC '+label();
        document.getElementById('title').textContent='AMFCC '+label();
        if (!window.APP_CONFIG || !window.APP_CONFIG.SUPABASE_URL || !window.APP_CONFIG.SUPABASE_PUBLISHABLE_KEY || !window.supabase)
          throw new Error('The AMFCC configuration failed to load.');
        client=window.supabase.createClient(window.APP_CONFIG.SUPABASE_URL,window.APP_CONFIG.SUPABASE_PUBLISHABLE_KEY,
          {auth:{persistSession:false,autoRefreshToken:false}});
        if(localStorage.getItem(STORAGE_KEY)) {
          show('Opening '+label()+'…',false);
          await signIn(true);
          cleanUrl();
          return;
        }
        show('IT must activate this iPad for '+label()+'.',false);
        form.hidden=false;
        setupInput.value=preloadSetup;
        if(preloadSetup) pinInput.focus(); else setupInput.focus();
      } catch(e) {show(e.message || 'Could not open department.',true);retry.hidden=false;}
    }
    form.addEventListener('submit',async function (event) {
      event.preventDefault();
      var button=document.getElementById('activate-button');
      button.disabled=true;
      show('Activating '+label()+' iPad…',false);
      form.hidden=false;
      try {
        var newKey=randomKey();
        var response=await rpc('ops_kiosk_enroll',{
          p_department_slug:department,p_setup_key:setupInput.value.trim(),
          p_activation_pin:pinInput.value,p_device_key:newKey,p_device_name:document.getElementById('device-name').value.trim()
        });
        if(response.status!=='success') throw new Error(response.message || 'Activation failed.');
        localStorage.setItem(STORAGE_KEY,newKey);
        setupInput.value='';pinInput.value='';preloadSetup='';
        cleanUrl();
        await signIn(true);
      } catch(e) {
        show(e.message || 'Activation failed.',true);
        if (!localStorage.getItem(STORAGE_KEY)) form.hidden=false;
        else retry.hidden=false;
      } finally {button.disabled=false;}
    });
    retry.addEventListener('click',function () {retry.hidden=true;form.hidden=true;start();});
    iframe.addEventListener('load',bindFrameActivity);
    window.addEventListener('online',function () {if(!view.hidden)start();});
    ['touchstart','pointerdown','keydown'].forEach(function (name) {document.addEventListener(name,recordActivity,{passive:true});});
    setInterval(async function () {
      if(refreshing || !sessionExpiry || Date.now()<sessionExpiry-90*60*1000 || Date.now()-lastActivity<5*60*1000) return;
      refreshing=true;
      try {await signIn(true);} catch(e) {
        if(Date.now()>sessionExpiry) {show('Connection interrupted. Check Wi-Fi and retry.',true);retry.hidden=false;}
      } finally {refreshing=false;}
    },60000);
    start();
  })();
  </script>
</body>
</html>
