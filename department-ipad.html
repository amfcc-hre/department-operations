<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123d2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AMFCC Department iPad</title>
  <link rel="icon" href="assets_icon.svg" type="image/svg+xml">
  <style>
    :root { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#173c2b; background:#eff5ef }
    * { box-sizing:border-box } body { margin:0 }
    main { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:20px }
    section { width:min(440px,100%); background:#fff; border-radius:18px; padding:28px; box-shadow:0 8px 35px #173c2b1a }
    h1 { font-size:26px; margin:0 0 8px } p { line-height:1.5; margin:8px 0 16px }
    label { display:block; margin:18px 0 8px; font-weight:600 }
    input { font-size:24px; letter-spacing:0.3em; width:100%; padding:14px; border:1px solid #9aafa1; border-radius:8px; text-align:center }
    button { border:0; border-radius:10px; background:#123d2b; color:#fff; padding:14px 16px; font-size:16px; width:100%; font-weight:600; margin-top:16px }
    button:disabled { opacity:.55 } .muted { color:#53645a } .error { color:#a22d2d }
    [hidden] { display:none !important }
    #workspace { border:0; display:block; width:100%; height:100vh; height:100dvh; background:#fff }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared_config.js?v=7-registration-exemptions"></script>
</head>
<body>
  <main id="login-view">
    <section>
      <p class="muted">AMFCC Harare · Department Operations</p>
      <h1 id="department-title">Department sign in</h1>
      <p class="muted">Enter your department's existing four-digit PIN to open its workspace.</p>
      <form id="pin-form">
        <label for="department-pin">Department PIN</label>
        <input id="department-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required>
        <button id="sign-in" type="submit">Open department</button>
      </form>
      <p id="message" class="muted" role="status" aria-live="polite"></p>
    </section>
  </main>
  <iframe id="workspace" title="AMFCC Department Operations" src="about:blank" hidden></iframe>
  <script>
  (function () {
    'use strict';
    var params=new URLSearchParams(window.location.search || '');
    var department=String(params.get('department') || '').trim().toLowerCase();
    var SESSION_KEY='amfcc_ops_session';
    var view=document.getElementById('login-view');
    var frame=document.getElementById('workspace');
    var form=document.getElementById('pin-form');
    var pin=document.getElementById('department-pin');
    var submit=document.getElementById('sign-in');
    var message=document.getElementById('message');
    var client=null,session=null,lastActivity=Date.now(),hiddenAt=0,loggingIn=false;
    var IDLE_LIMIT=20*60*1000;
    var BACKGROUND_LIMIT=60*1000;

    function label() {
      return department.split('-').map(function(p) {return p.charAt(0).toUpperCase()+p.slice(1);}).join(' ');
    }
    function report(text,isError) {
      message.textContent=text||'';
      message.className=isError?'error':'muted';
    }
    function displayLogin(text) {
      sessionStorage.removeItem(SESSION_KEY);
      session=null;
      frame.hidden=true;
      frame.src='about:blank';
      view.hidden=false;
      pin.value='';
      submit.disabled=false;
      loggingIn=false;
      report(text||'',false);
      pin.focus();
    }
    function lock(reason) {
      var token=session && session.session_token;
      displayLogin(reason||'Enter your PIN to continue.');
      if(token && client) client.rpc('ops_logout',{p_session_token:token}).catch(function(){});
    }
    function recordActivity() { lastActivity=Date.now(); }
    function watchFrame() {
      if(frame.hidden) return;
      try {
        var doc=frame.contentWindow.document;
        ['touchstart','pointerdown','keydown','input'].forEach(function(name) {
          doc.addEventListener(name,recordActivity,{passive:true});
        });
        var innerLogin=doc.getElementById('login-screen');
        if(innerLogin) {
          var observer=new MutationObserver(function() {
            if(!innerLogin.hidden && !frame.hidden) {
              observer.disconnect();
              displayLogin('Signed out. Enter your PIN to continue.');
            }
          });
          observer.observe(innerLogin,{attributes:true,attributeFilter:['hidden']});
        }
      } catch(err) { /* Internal workspace may navigate temporarily. */ }
    }

    try {
      if(!/^[a-z0-9][a-z0-9-]{1,79}$/.test(department))
        throw new Error('Missing or invalid department in this Web Clip URL.');
      document.getElementById('department-title').textContent='AMFCC '+label();
      document.title='AMFCC '+label();
      if(!window.supabase || !window.APP_CONFIG ||
         !window.APP_CONFIG.SUPABASE_URL || !window.APP_CONFIG.SUPABASE_PUBLISHABLE_KEY)
        throw new Error('Unable to load the AMFCC site configuration.');
      client=window.supabase.createClient(window.APP_CONFIG.SUPABASE_URL,
        window.APP_CONFIG.SUPABASE_PUBLISHABLE_KEY,
        {auth:{persistSession:false,autoRefreshToken:false}});
      // A fresh page load requires the department PIN. No permanent device credential is stored.
      sessionStorage.removeItem(SESSION_KEY);
      if(params.has('setup')) history.replaceState({},document.title,location.pathname+'?department='+encodeURIComponent(department));
      pin.focus();
    } catch(err) {
      report(err.message||'Unable to open this department.',true);
      submit.disabled=true;
    }

    form.addEventListener('submit',async function(event) {
      event.preventDefault();
      if(loggingIn || !client) return;
      var entered=pin.value;
      if(!/^[0-9]{4}$/.test(entered)) {report('Enter the four-digit department PIN.',true);return;}
      loggingIn=true;
      submit.disabled=true;
      report('Checking department PIN…',false);
      try {
        var response=await client.rpc('ops_department_kiosk_pin_login',{
          p_department_slug:department,
          p_access_code:entered
        });
        if(response.error) throw new Error(response.error.message||'Login failed.');
        var result=response.data||{};
        if(result.status!=='success') throw new Error(result.message||'Incorrect department PIN.');
        if(result.role!=='department' || !result.department ||
           result.department.slug!==department || !result.session_token)
          throw new Error('The server did not authorise this department.');
        session=result;
        sessionStorage.setItem(SESSION_KEY,JSON.stringify(result));
        pin.value='';
        recordActivity();
        view.hidden=true;
        frame.hidden=false;
        frame.src='index.html';
      } catch(err) {
        report(err.message||'Unable to open department.',true);
        pin.value='';
        pin.focus();
      } finally {
        loggingIn=false;
        submit.disabled=false;
      }
    });
    frame.addEventListener('load',watchFrame);
    ['touchstart','pointerdown','keydown'].forEach(function(name) {
      document.addEventListener(name,recordActivity,{passive:true});
    });
    document.addEventListener('visibilitychange',function() {
      if(document.hidden) hiddenAt=Date.now();
      else if(session && hiddenAt && Date.now()-hiddenAt>BACKGROUND_LIMIT)
        lock('Department locked after being in the background. Enter your PIN to reopen.');
      if(!document.hidden) hiddenAt=0;
    });
    setInterval(function() {
      if(!session) return;
      if(Date.now()-lastActivity>IDLE_LIMIT)
        lock('Session ended after 20 minutes without activity. Enter your PIN to reopen.');
      else if(session.expires_at && new Date(session.expires_at).getTime()<=Date.now())
        lock('Session expired. Enter your PIN to reopen.');
    },30000);
  })();
  </script>
</body>
</html>
