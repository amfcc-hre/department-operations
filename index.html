<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123d2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>AMFCC Department Operations Portal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets_icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shared_ui.css">
  <link rel="stylesheet" href="operations.css?v=12">
  <link rel="stylesheet" href="asset-register.css?v=1">
  <link rel="stylesheet" href="it-register.css?v=1">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <main id="login-screen" class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">A</div>
      <p class="eyebrow">AMFCC Harare</p>
      <h1 id="login-title">Department Operations</h1>
      <p class="muted">Plan work, receive student allocations and submit one connected report.</p>

      <form id="login-form" class="form-stack">
        <label for="access-type">Workspace</label>
        <select id="access-type" required>
          <option value="department">Department</option>
          <option value="student_leadership">Student Leadership</option>
          <option value="management">Management</option>
          <option value="administrator">School Administration</option>
        </select>

        <div id="department-login-field"></div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared_config.js?v=4"></script>
  <script src="asset-register.js?v=1"></script>
  <script src="operations.js?v=26"></script>
</body>
</html>
