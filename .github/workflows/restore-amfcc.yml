name: Validate AMFCC Department Operations

on:
  push:
    paths:
      - ".github/workflows/restore-amfcc.yml"
      - "*.html"
      - "*.js"
      - "*.css"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate current application files
        shell: bash
        run: |
          set -euo pipefail
          node --check operations.js
          node --check shared_config.js
          node --check enrolment_tracking.js
          node --check fee_enrolment_controls.js
          node --check vehicle-dashboard.js
          node --check vehicle-checkout.js
          node --check sw.js

      - name: Check dashboard and standalone entry points
        shell: python
        run: |
          from pathlib import Path

          shell = Path("index.html").read_text(encoding="utf-8")
          page = Path("vehicles.html").read_text(encoding="utf-8")
          config = Path("shared_config.js").read_text(encoding="utf-8")
          for marker in ('id="app-shell"', 'id="main-nav"', 'data-vehicle-dashboard', 'vehicle-dashboard.js', 'href="vehicles.html"'):
              assert marker in shell, f"Missing dashboard entry point: {marker}"
          for marker in ('id="vehicle-app"', 'vehicle-checkout.js', 'vehicle-dashboard.js'):
              assert marker in page, f"Missing standalone entry point: {marker}"
          for script in ('enrolment_tracking.js', 'fee_enrolment_controls.js'):
              assert script in config, f"Missing Term enrolment loader: {script}"
              assert Path(script).is_file(), f"Missing Term enrolment script: {script}"
          assert Path("vehicle-checkout.css").is_file(), "Missing vehicle styles"
